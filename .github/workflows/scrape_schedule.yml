name: Scrape Schedules

on:
  schedule:
    # In season (February–June): every 3 hours.
    - cron: '0 */3 * 2-6 *'
    # January, while schedules are being finalised: daily.
    - cron: '41 14 * 1 *'
    # Rest of the offseason: weekly (Monday), to pick up newly published schedules.
    - cron: '41 14 * 7-12 1'
  workflow_dispatch:
    # Also allows manual trigger from GitHub Actions tab

# The schedule scraper rewrites the whole Schedule tab, so two runs must never
# overlap. A second run waits for the first.
concurrency:
  group: sheet-schedule
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: '1'  # show the log as it runs, not all at the end
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run schedule scraper
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python scrape_schedule.py
