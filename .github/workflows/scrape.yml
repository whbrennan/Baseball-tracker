name: Baseball Stats Scraper

on:
  schedule:
    # In season (February–June): every 2 hours, 12pm–10pm EDT = 4pm–2am UTC.
    - cron: '0 16,18,20,22,0,2 * 2-6 *'
    # Offseason: once a week (Monday 11:23am EDT), so the run log keeps
    # showing the scraper works and late stat corrections are picked up.
    - cron: '23 15 * 1,7-12 1'
  workflow_dispatch:  # allows manual trigger from GitHub anytime

# Least privilege: this workflow's token can only read the repository.
permissions:
  contents: read

# One stats run at a time: a manual run waits for a scheduled one (and vice
# versa) instead of both writing the same sheet rows. The Players-tab fixer
# shares this group so it never edits Players mid-scrape.
concurrency:
  group: sheet-stats
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: '1'  # show the log as it runs, not all at the end
    # A normal run takes about 6 minutes; stop a hung browser or site long
    # before GitHub's 6-hour default.
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false  # don't leave the token in .git/config

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium and its system libraries
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python scraper.py
