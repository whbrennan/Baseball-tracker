name: Repair History

# Manual only. Repairs history rows written with shifted or missing columns
# (the check that used to run before every stats scrape). Leave "apply"
# unticked for a dry run that only reports what it would change.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the repairs to the sheet (untick for a dry run)"
        type: boolean
        default: false

# Least privilege: this workflow's token can only read the repository.
permissions:
  contents: read

# Never alongside a stats scrape: both write the history tabs.
concurrency:
  group: sheet-stats
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Repair history
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python repair_history.py ${{ inputs.apply && '--apply' || '' }}
