name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow's token can only read the repository.
permissions:
  contents: read

# A newer push to the same branch makes an older test run pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # don't leave the token in .git/config

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium and its system libraries
        run: python -m playwright install --with-deps chromium

      # No secrets: tests use saved pages and an in-memory sheet.
      - name: Run tests
        run: python -m pytest
