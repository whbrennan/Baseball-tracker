name: Fix History (one-off)

# Manual only. Corrects history rows written before the CS fix (#51) and the
# innings-pitched fix, and removes the duplicate snapshots those fixes caused.
# Leave "apply" unticked for a dry run that only lists the changes.
# Run it after the fixes are on main, so no old-code run writes again.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the corrections to the sheet (untick for a dry run)"
        type: boolean
        default: false

# Never alongside a stats scrape: both write the history tabs.
concurrency:
  group: sheet-stats
  cancel-in-progress: false

permissions:
  actions: read    # list the stats workflow's runs
  contents: read   # read scraper.py at each run's commit

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fix history
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python fix_history.py ${{ inputs.apply && '--apply' || '' }}
