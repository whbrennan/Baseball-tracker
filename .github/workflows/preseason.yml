name: Preseason URL Check

# Manual. Opens every schedule and stats URL for a season and reports which
# pages are ready. Writes nothing to the sheet. See PRESEASON.md.
on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season to check (blank = the one in season.json)"
        type: string
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium and its system libraries
        run: python -m playwright install --with-deps chromium

      - name: Check URLs
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SEASON_INPUT: ${{ inputs.season }}
        run: python check_season.py ${SEASON_INPUT:+--season "$SEASON_INPUT"}
